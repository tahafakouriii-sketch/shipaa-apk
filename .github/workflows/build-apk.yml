name: Build SHIPAA Android v1.1.0

on:
  push:
    branches: [main]
    paths:
      - 'shipaa-android-v1.1.0.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-v1-1:
    name: Validate, test and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify uploaded v1.1.0 source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f shipaa-android-v1.1.0.zip || {
            echo "::error::Upload the supplied shipaa-android-v1.1.0.zip to the repository root before running this workflow."
            exit 1
          }
          unzip -tq shipaa-android-v1.1.0.zip
          mkdir -p src
          unzip -q shipaa-android-v1.1.0.zip -d src
          test -f src/shipaa-android/settings.gradle.kts
          test -f src/shipaa-android/app/build.gradle.kts
          test -f src/shipaa-android/gradlew
          test -f src/shipaa-android/gradle/wrapper/gradle-wrapper.jar
          echo "PROJECT_DIR=src/shipaa-android" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Check WordPress sync PHP tests
        shell: bash
        working-directory: src/shipaa-android
        run: |
          php -l wordpress/shipaa-app-sync/shipaa-app-sync.php
          php -l wordpress/shipaa-app-sync/uninstall.php
          php wordpress/shipaa-app-sync/tests/run-tests.php

      - name: Check bridge tests
        working-directory: src/shipaa-android/tools/bridge-test
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Gradle tests, APK and lint
        shell: bash
        working-directory: src/shipaa-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug

      - name: Upload APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: shipaa-android-v1.1.0-debug-apk
          path: src/shipaa-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipaa-v1.1.0-test-reports
          path: |
            src/shipaa-android/app/build/reports/
            src/shipaa-android/app/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
