name: Build SHIPAA Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shipaa-android-v1.0.0.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f shipaa-android-v1.0.0.zip
          mkdir -p extracted
          unzip -q shipaa-android-v1.0.0.zip -d extracted
          echo "Top-level ZIP contents:"
          unzip -Z -1 shipaa-android-v1.0.0.zip | head -50
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) ! -path '*/__MACOSX/*' | sort | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found in archive. ZIP must contain Android source project, not only an APK."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK from extracted source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -d app ]; then
            gradle --no-daemon :app:assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          find extracted -type f -path '*/build/outputs/apk/debug/*.apk' -printf '%p (%s bytes)\n'
          test -n "$(find extracted -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shipaa-android-v1-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
